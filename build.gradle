plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
}

allprojects {
    group = 'dev.kizuna.navigation'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-Xlint:deprecation')
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

tasks.named('assemble') { dependsOn ':core:assemble', ':fabric:assemble' }
tasks.named('check') { dependsOn ':core:check', ':fabric:check' }
tasks.named('clean') { dependsOn ':core:clean', ':fabric:clean' }
